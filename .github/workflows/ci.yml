name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The package needs Swift 6.2 or later (swift-tools-version 6.2)
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test with coverage
        run: swift test --enable-code-coverage

      # Line coverage of Sources/ on the run's summary; fails below the minimum (keep coverage where it is)
      - name: Coverage
        env:
          MIN_LINE_COVERAGE: "90"
        run: |
          python3 - "$(swift test --show-codecov-path)" <<'PY'
          import json, os, sys
          files = json.load(open(sys.argv[1]))["data"][0]["files"]
          covered = total = 0
          rows = []
          for f in files:
              if "/Sources/" not in f["filename"]:
                  continue
              lines = f["summary"]["lines"]
              covered += lines["covered"]
              total += lines["count"]
              rows.append((f["filename"].split("/Sources/")[1], lines["percent"]))
          percent = 100 * covered / total
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Line coverage: {percent:.1f} % ({covered}/{total})\n\n| File | % |\n|---|---|\n")
              out.writelines(f"| {name} | {p:.1f} |\n" for name, p in sorted(rows, key=lambda r: r[1]))
          print(f"line coverage {percent:.1f} %")
          if percent < float(os.environ["MIN_LINE_COVERAGE"]):
              sys.exit(f"line coverage {percent:.1f} % is below {os.environ['MIN_LINE_COVERAGE']} %")
          PY

  # Dependencies (Package.resolved, once there are any), secrets and misconfigurations: fails on any secret and on
  # CRITICAL/HIGH vulnerabilities with a fixed version; accept a risk only in .trivyignore.yaml with a reason and expiry
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .build

      - name: Trivy (everything, for the log)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "0"
          skip-dirs: .build
          skip-setup-trivy: true
